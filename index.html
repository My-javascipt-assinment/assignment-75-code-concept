    <style>
        /* Wrap your input */
.input-wrapper {
position: relative;
display: inline-block;
}

/* Your existing input */
.input-wrapper input {
padding: 12px;
border: none;
outline: none;
background: #111;
color: white;
position: relative;
z-index: 1;
}

/* Animated border */
.input-wrapper::before {
content: "";
position: absolute;
inset: -2px;
border-radius: 6px;

background: linear-gradient(
90deg,
#00f,
#0ff,
#0f0,
#ff0,
#f00,
#00f
);

background-size: 300% 300%;
animation: borderRun 4s linear infinite;
z-index: 0;
}

/* Inner background (to make border visible only) */
.input-wrapper::after {
content: "";
position: absolute;
inset: 2px;
background: #111;
border-radius: 6px;
z-index: 0;
}

/* Animation */
@keyframes borderRun {
0% {
background-position: 0% 50%;
}
100% {
background-position: 300% 50%;
}
}

    </style>
</head>
